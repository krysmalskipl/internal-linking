[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-linking"
version = "0.5.0"
description = "Internal link suggestions for any website, judged by the Jev model via OpenRouter, with an embeddings-based link graph"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Krysmalski" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
internal-linking = "internal_linking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
internal_linking = ["config.json", "vendor/*", "ui/*.html", "ui/*.js", "ui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
